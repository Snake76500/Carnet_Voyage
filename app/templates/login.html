{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="auth-container" style="max-width: 440px; margin: 60px auto; padding: 0 20px;">
  <div class="card" style="background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-xl); padding: 36px 32px;">
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="width: 56px; height: 56px; background: linear-gradient(135deg, var(--primary), #FF7B80); color: white; border-radius: var(--radius-md); display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 16px; box-shadow: var(--shadow-glow);">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-main); margin-bottom: 8px;">Connexion</h1>
      <p style="color: var(--text-muted); font-size: 0.92rem;">Connexion requise pour consulter le carnet de voyage</p>
    </div>

    {% if error %}
    <div style="background: #FEE2E2; border: 1px solid #FCA5A5; color: #991B1B; padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 24px; font-size: 0.88rem; display: flex; align-items: center; gap: 10px;">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post" action="/login" style="display: flex; flex-direction: column; gap: 20px;">
      <input type="hidden" name="next" value="{{ next }}">

      <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
        <label for="username" style="font-weight: 600; font-size: 0.88rem; color: var(--text-main);">
          Identifiant
        </label>
        <div style="position: relative;">
          <i class="fa-solid fa-user" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 0.95rem;"></i>
          <input
            type="text"
            id="username"
            name="username"
            value="{{ username or '' }}"
            required
            autofocus
            placeholder="Nom d'utilisateur"
            style="width: 100%; padding: 10px 14px 10px 38px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); font-size: 0.95rem; font-family: inherit; outline: none; transition: border-color 0.2s;"
            onfocus="this.style.borderColor='var(--border-focus)'"
            onblur="this.style.borderColor='var(--border-color)'"
          >
        </div>
      </div>

      <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
        <label for="password" style="font-weight: 600; font-size: 0.88rem; color: var(--text-main);">
          Mot de passe
        </label>
        <div style="position: relative;">
          <i class="fa-solid fa-key" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 0.95rem;"></i>
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="••••••••"
            style="width: 100%; padding: 10px 14px 10px 38px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); font-size: 0.95rem; font-family: inherit; outline: none; transition: border-color 0.2s;"
            onfocus="this.style.borderColor='var(--border-focus)'"
            onblur="this.style.borderColor='var(--border-color)'"
          >
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem; margin-top: 8px;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Se connecter
      </button>
    </form>

    <div style="margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border-color); font-size: 0.82rem; color: var(--text-muted); background: var(--bg-subtle); border-radius: var(--radius-sm); padding: 14px 16px;">
      <div style="font-weight: 700; margin-bottom: 6px; color: var(--text-main); display: flex; align-items: center; gap: 6px;">
        <i class="fa-solid fa-circle-info" style="color: var(--secondary);"></i> Comptes de démonstration :
      </div>
      <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
        <span><strong>Admin :</strong> admin</span>
        <code style="background: rgba(0,0,0,0.05); padding: 1px 6px; border-radius: 4px;">admin123</code>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <span><strong>Invité :</strong> invite</span>
        <code style="background: rgba(0,0,0,0.05); padding: 1px 6px; border-radius: 4px;">voyage123</code>
      </div>
    </div>
  </div>
</div>
{% endblock %}
