<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Carnet de Voyage{% endblock %} • Polarsteps Vibe</title>
  <meta name="description" content="{% block meta_description %}Carnet de voyage personnel avec journal quotidien, photos, vidéos et carte interactive synchronisée.{% endblock %}">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/static/css/style.css">

  {% block extra_head %}{% endblock %}
</head>
<body>
  <!-- Navigation Header -->
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <div class="brand-icon">
          <i class="fa-solid fa-compass"></i>
        </div>
        <div class="brand-text">Carnet<span>Voyage</span></div>
      </a>
      <div class="nav-actions">
        {% block nav_actions %}
        <a href="/trips/new" class="btn btn-primary btn-sm">
          <i class="fa-solid fa-plus"></i> Nouveau Voyage
        </a>
        {% endblock %}
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-wrapper">
    {% block content %}{% endblock %}
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  {% block scripts %}{% endblock %}
</body>
</html>
