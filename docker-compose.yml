version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: voyage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_travel_secret}
      POSTGRES_DB: ${POSTGRES_DB:-travel_journal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_journal"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: voyage_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres_travel_secret@db:5432/travel_journal
      SECRET_KEY: ${SECRET_KEY:-travel-journal-super-secret-key-change-in-production}
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
